<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="50%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>

    <!-- Brand Crimson Rose Glow Gradient -->
    <linearGradient id="tahraGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3b5c" />
      <stop offset="40%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>

    <!-- Metallic Shield Accent -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="128" fill="url(#bgGrad)" stroke="#27272a" stroke-width="8" />
  
  <!-- Subtle Internal Ring -->
  <rect x="36" y="36" width="440" height="440" rx="116" fill="none" stroke="url(#accentGrad)" stroke-width="2" />

  <!-- Ambient Glow Behind Icon -->
  <circle cx="256" cy="256" r="140" fill="#f43f5e" opacity="0.18" filter="url(#glow)" />

  <!-- Stylized Geometric "T" & Autonomous Wings -->
  <!-- Top Horizontal Bar of "T" -->
  <path
    d="M 120 152 C 120 138.7 130.7 128 144 128 L 368 128 C 381.3 128 392 138.7 392 152 L 392 188 C 392 201.3 381.3 212 368 212 L 292 212 L 292 368 C 292 381.3 281.3 392 268 392 L 244 392 C 230.7 392 220 381.3 220 368 L 220 212 L 144 212 C 130.7 212 120 201.3 120 188 Z"
    fill="url(#tahraGlow)"
  />

  <!-- Top Glass Highlight -->
  <path
    d="M 144 132 L 368 132 C 378 132 386 140 386 150 L 386 160 C 386 152 378 144 368 144 L 144 144 C 134 144 126 152 126 160 L 126 150 C 126 140 134 132 144 132 Z"
    fill="#ffffff"
    opacity="0.35"
  />

  <!-- AI Autonomous Spark Star (Top Right of T) -->
  <path
    d="M 390 120 Q 390 85 365 85 Q 390 85 390 50 Q 390 85 415 85 Q 390 85 390 120 Z"
    fill="#ffffff"
    filter="url(#glow)"
  />

  <!-- Left Bottom Growth Node -->
  <circle cx="152" cy="360" r="10" fill="#f43f5e" opacity="0.8" />
  <path d="M 152 360 L 220 320" stroke="#f43f5e" stroke-width="3" stroke-dasharray="4 4" opacity="0.4" />

  <!-- Right Bottom Growth Node -->
  <circle cx="360" cy="360" r="10" fill="#34d399" opacity="0.8" />
  <path d="M 360 360 L 292 320" stroke="#34d399" stroke-width="3" stroke-dasharray="4 4" opacity="0.4" />
</svg>
