<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f1f23" />
      <stop offset="50%" stop-color="#0f0f12" />
      <stop offset="100%" stop-color="#050507" />
    </linearGradient>

    <linearGradient id="wingLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d6d" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>

    <linearGradient id="wingRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff758f" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff2a55" />
      <stop offset="70%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#9f1239" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#27272a" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#e11d48" stop-opacity="0.7" />
    </linearGradient>
  </defs>

  <!-- Base Squircle Container -->
  <rect
    x="4"
    y="4"
    width="92"
    height="92"
    rx="24"
    fill="url(#bgGrad)"
    stroke="url(#borderGrad)"
    stroke-width="3"
  />

  <!-- Inner Subtle Tech Ring -->
  <rect
    x="8"
    y="8"
    width="84"
    height="84"
    rx="20"
    fill="none"
    stroke="#ffffff"
    stroke-opacity="0.06"
    stroke-width="1.5"
  />

  <!-- Central Glowing Ambient Spot -->
  <circle cx="50" cy="50" r="28" fill="#f43f5e" opacity="0.2" />

  <!-- === THE ICONIC 3D CYBER 'T' === -->

  <!-- Left Wing of 'T' Crossbar -->
  <path
    d="M 22 30 C 22 26 25 23 29 23 L 48 23 L 48 39 L 26 39 C 23.8 39 22 37.2 22 35 Z"
    fill="url(#wingLeft)"
  />

  <!-- Right Wing of 'T' Crossbar -->
  <path
    d="M 52 23 L 71 23 C 75 23 78 26 78 30 L 78 35 C 78 37.2 76.2 39 74 39 L 52 39 Z"
    fill="url(#wingRight)"
  />

  <!-- Vertical Stem of 'T' -->
  <path
    d="M 43 36 L 57 36 L 57 71 C 57 74.3 54.3 77 51 77 L 49 77 C 45.7 77 43 74.3 43 71 Z"
    fill="url(#stemGrad)"
  />

  <!-- Inner Prism Diamond Center Core -->
  <polygon
    points="50,29 55,36 50,43 45,36"
    fill="#ffffff"
    opacity="0.95"
  />

  <!-- Top Edge Gloss Highlight -->
  <path
    d="M 28 25 L 72 25 C 74 25 76 26.5 76 28 C 76 27 74 26 72 26 L 28 26 C 26 26 24 27 24 28 C 24 26.5 26 25 28 25 Z"
    fill="#ffffff"
    opacity="0.75"
  />

  <!-- AI Sparkle Star (Top Right) -->
  <path
    d="M 76 18 Q 76 12 70 12 Q 76 12 76 6 Q 76 12 82 12 Q 76 12 76 18 Z"
    fill="#ffffff"
  />
  <circle cx="76" cy="12" r="1.5" fill="#f43f5e" />
</svg>