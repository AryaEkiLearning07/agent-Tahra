version: '3.8'

# Isolated project namespace to prevent collision with other Docker projects
name: tahra-platform

services:
  # -------------------------------------------------------------
  # 1. DATABASE SERVICE (MariaDB 11.4)
  # -------------------------------------------------------------
  tahra-db:
    image: mariadb:11.4
    container_name: tahra-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-tahra_root_2026}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-tahra_db}
      MARIADB_USER: ${MARIADB_USER:-tahra_admin}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-tahra_secret_2026}
    volumes:
      - tahra_mariadb_data:/var/lib/mysql
      - ./database/tahra_db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${DB_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u root -p$$MARIADB_ROOT_PASSWORD || mariadb-admin ping -h 127.0.0.1 -u $$MARIADB_USER -p$$MARIADB_PASSWORD || exit 1"]
      interval: 4s
      timeout: 5s
      retries: 25
      start_period: 15s
    networks:
      - tahra-network

  # -------------------------------------------------------------
  # 2. FASTAPI MULTI-AGENT BACKEND
  # -------------------------------------------------------------
  tahra-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tahra-backend
    restart: unless-stopped
    depends_on:
      tahra-db:
        condition: service_healthy
    environment:
      - ENVIRONMENT=production
      - LLM_API_KEY=${LLM_API_KEY:-${GROQ_API_KEY}}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LLM_PROVIDER=${LLM_PROVIDER:-groq}
      - LLM_MODEL=${LLM_MODEL:-llama-3.3-70b-versatile}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.groq.com/openai/v1}
    ports:
      - "${BACKEND_PORT:-8001}:8000"
    networks:
      - tahra-network

  # -------------------------------------------------------------
  # 3. REACT + NGINX FRONTEND
  # -------------------------------------------------------------
  tahra-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tahra-frontend
    restart: unless-stopped
    depends_on:
      - tahra-backend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    networks:
      - tahra-network

volumes:
  tahra_mariadb_data:
    driver: local

networks:
  tahra-network:
    driver: bridge
